appId: me.ash.reader.desktop
productName: OrigRead
directories:
  buildResources: resources
  output: release
files:
  - out/**
  - resources/**
  - package.json
asar: true
win:
  target:
    - nsis
  artifactName: OrigRead-${version}-x64.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
mac:
  target:
    - dmg
  category: public.app-category.news
  artifactName: OrigRead-${version}-arm64.${ext}
linux:
  target:
    - AppImage
    - deb
  category: Network
  executableName: origread
  syncDesktopName: true
  artifactName: OrigRead-${version}-x64.${ext}
