name: Build Desktop

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${{ github.ref_name }}" --no-git-tag-version --allow-same-version --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Electron renderer smoke
        run: npx playwright test tests/e2e/platform-smoke.spec.ts
      - name: Build NSIS x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --win nsis --x64 --publish never
      - name: Verify Windows installer
        shell: pwsh
        run: |
          $files = Get-ChildItem release -Filter "OrigRead-*-x64.exe"
          if ($files.Count -lt 1) { throw "Windows NSIS installer was not generated" }
          $files | Format-Table Name, Length
      - uses: actions/upload-artifact@v4
        with:
          name: origread-windows-x64
          path: release/OrigRead-*-x64.exe
          if-no-files-found: error

  macos:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${{ github.ref_name }}" --no-git-tag-version --allow-same-version --ignore-scripts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Electron renderer smoke
        run: npx playwright test tests/e2e/platform-smoke.spec.ts
      - name: Build unsigned DMG arm64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --mac dmg --arm64 --publish never
      - name: Verify macOS package
        run: |
          ls -lh release/OrigRead-*-arm64.dmg
          test -f $(find release -maxdepth 1 -name 'OrigRead-*-arm64.dmg' -print -quit)
      - uses: actions/upload-artifact@v4
        with:
          name: origread-macos-arm64
          path: release/OrigRead-*-arm64.dmg
          if-no-files-found: error

  linux:
    name: Ubuntu x64
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Apply tag version
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version "${{ github.ref_name }}" --no-git-tag-version --allow-same-version --ignore-scripts
      - name: Install Electron runtime dependencies
        run: npx playwright install-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Electron renderer smoke under Xvfb
        run: xvfb-run -a npx playwright test tests/e2e/platform-smoke.spec.ts
      - name: Build AppImage and DEB x64
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --linux AppImage deb --x64 --publish never
      - name: Verify Linux packages
        run: |
          ls -lh release/OrigRead-*-x64.AppImage
          ls -lh release/OrigRead-*-x64.deb
          test -n "$(find release -maxdepth 1 -name 'OrigRead-*-x64.AppImage' -print -quit)"
          test -n "$(find release -maxdepth 1 -name 'OrigRead-*-x64.deb' -print -quit)"
      - uses: actions/upload-artifact@v4
        with:
          name: origread-linux-x64
          path: |
            release/OrigRead-*-x64.AppImage
            release/OrigRead-*-x64.deb
          if-no-files-found: error

  release:
    name: Publish tagged installers
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - windows
      - macos
      - linux
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: origread-*
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: OrigRead Desktop ${{ github.ref_name }}
          generate_release_notes: true
          files: release-assets/*
